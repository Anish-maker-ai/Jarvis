<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181b25"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="128" fill="none" stroke="#00f0ff" stroke-width="6" opacity="0.4"/>

  <!-- Rotating Cybernetic Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#3b494b" stroke-width="4" stroke-dasharray="10 16" opacity="0.6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00f0ff" stroke-width="6" stroke-dasharray="32 24" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#98cbff" stroke-width="4" stroke-dasharray="40 12 16 12" opacity="0.8"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#6d3bd7" stroke-width="5" stroke-dasharray="12 28"/>
  <circle cx="256" cy="256" r="75" fill="none" stroke="#00f0ff" stroke-width="8" stroke-dasharray="60 30" filter="url(#glow)"/>

  <!-- Central Power Core Orb -->
  <circle cx="256" cy="256" r="54" fill="#1c1f29" stroke="#00f0ff" stroke-width="4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="42" fill="#00363a" opacity="0.8"/>

  <!-- Central JARVIS Emblem -->
  <text x="256" y="264" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="900" letter-spacing="3" text-anchor="middle" filter="url(#glow)">JARVIS</text>
</svg>
